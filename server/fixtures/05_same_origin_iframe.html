<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fixture 05 - Same-Origin Iframe</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; }
    iframe { width: 100%; height: 250px; border: 2px dashed #94a3b8; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>Host Page</h2>
  <p>Below is an embedded same-origin iframe:</p>
  <iframe id="testIframe" srcdoc="
    <!DOCTYPE html>
    <html>
    <head>
      <style>body { font-family: sans-serif; padding: 15px; background: #fff7ed; }</style>
    </head>
    <body>
      <h4>Frame Content</h4>
      <p>Inside iframe email: <span data-pii='email'>iframe.user@example.com</span></p>
      <p>Inside iframe phone: <span data-pii='phone'>9876543210</span></p>
    </body>
    </html>
  "></iframe>

  <script>
    window.__groundTruth = function() {
      const items = [];
      const iframe = document.getElementById('testIframe');
      if (iframe && iframe.contentDocument) {
        const doc = iframe.contentDocument;
        const frameRect = iframe.getBoundingClientRect();
        doc.querySelectorAll('[data-pii]').forEach(node => {
          const category = node.getAttribute('data-pii');
          const range = doc.createRange();
          range.selectNodeContents(node);
          const clientRects = Array.from(range.getClientRects());
          let rects = clientRects.map(r => ({
            x: frameRect.left + r.left,
            y: frameRect.top + r.top,
            width: r.width,
            height: r.height
          }));
          if (rects.length === 0) {
            const r = node.getBoundingClientRect();
            rects = [{ x: frameRect.left + r.left, y: frameRect.top + r.top, width: r.width, height: r.height }];
          }
          items.push({
            category: category,
            rects: rects,
            text: node.innerText || ''
          });
        });
      }
      return items;
    };
  </script>
</body>
</html>
