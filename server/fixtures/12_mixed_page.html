    window.__groundTruth = function() {
      const items = [];
      document.querySelectorAll('[data-pii]').forEach(node => {
        const category = node.getAttribute('data-pii');

        if (node.tagName === 'IMG') {

          rects = [{ x: r.left, y: r.top, width: r.width, height: r.height }];
        } else {
          const range = document.createRange();
          range.selectNodeContents(node);
          const clientRects = Array.from(range.getClientRects());
          rects = clientRects.map(r => ({ x: r.left, y: r.top, width: r.width, height: r.height }));

            const r = node.getBoundingClientRect();

          rects: rects,
